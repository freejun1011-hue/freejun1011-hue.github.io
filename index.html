<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안녕하세요! 저를 소개합니다</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #ddd;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }
        .tags {
            margin-top: 20px;
        }
        .tag {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            margin: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- 프로필 아이콘 (나중에 사진으로 바꿀 수 있어요) -->
    <div class="profile-img">👋</div>
    
    <h1>안녕하세요, freejun1011-hue 입니다!</h1>
    <p>저의 첫 깃허브 웹사이트에 오신 것을 환영합니다.<br>컴퓨터를 꺼두어도 24시간 열려있는 나만의 공간입니다.</p>
    
    <div class="tags">
        <span class="tag">#HTML</span>
        <span class="tag">#GitHubPages</span>
        <span class="tag">#웹서버</span>
    </div>
</div>

</body>
</html>
